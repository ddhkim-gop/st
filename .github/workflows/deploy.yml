name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
  deploy:
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Upload and deploy are separate jobs: deploy-pages raced its own
      # artifact's visibility when both ran in one job
      # (actions/deploy-pages#451). The poll below is a bounded backstop in
      # case the artifact list still lags.
      - name: Wait for github-pages artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 10); do
            found=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              | jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' || echo 0)
            if [ "${found:-0}" -ge 1 ]; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::github-pages artifact not visible after 10 polls"
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
