name: Auto-refresh transactions

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Sleeper players data
        uses: actions/cache@v4
        with:
          path: scripts/players_cache.json
          key: sleeper-players-${{ hashFiles('scripts/players_cache.json') }}
          restore-keys: |
            sleeper-players-

      - name: Refresh transactions and rosters
        id: refresh
        run: python3 scripts/refresh_transactions.py
        continue-on-error: true   # exit code 1 = no changes (not an error)

      - name: Commit and push if data changed
        id: commit
        if: steps.refresh.outcome == 'success' && steps.refresh.conclusion == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js *.html data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-refresh: update transactions and rosters"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Deploy in-run: a push made with GITHUB_TOKEN can't trigger deploy.yml, so
  # without this the refreshed data waited for the next push from the Mac.
  # Upload and deploy are separate jobs: deploy-pages raced its own artifact's
  # visibility when both ran in one job (actions/deploy-pages#451).
  upload:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # ref: main, not the triggering SHA - that predates the refresh job's push.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
  deploy:
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for github-pages artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 10); do
            found=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              | jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' || echo 0)
            if [ "${found:-0}" -ge 1 ]; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::github-pages artifact not visible after 10 polls"
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
